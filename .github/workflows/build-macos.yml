name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "Data Anonymizer" --onefile --windowed --collect-all customtkinter --noconfirm main.py

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r "Data Anonymizer-macOS.zip" "Data Anonymizer.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Data-Anonymizer-macOS
          path: dist/Data Anonymizer-macOS.zip
